name: Supabase keep-alive

on:
  schedule:
    - cron: '0 3 * * 1,4'   # 매주 월·목 03:00 UTC = 12:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: SolaNavi.html에서 Supabase 접속정보 추출
        id: cfg
        run: |
          set -euo pipefail
          URL=$(grep -oP "const SUPABASE_URL = '\K[^']+" SolaNavi.html | head -1)
          KEY=$(grep -oP "const SUPABASE_KEY = '\K[^']+" SolaNavi.html | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SolaNavi.html에서 SUPABASE_URL/KEY를 찾지 못했습니다."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "대상: $URL"

      - name: 프로젝트 깨우기 + 상태 확인
        run: |
          set -euo pipefail
          URL='${{ steps.cfg.outputs.url }}'
          KEY='${{ steps.cfg.outputs.key }}'
          CODE=$(curl -sS -m 60 -o /tmp/body.txt -w '%{http_code}' \
            "$URL/rest/v1/villages?select=user_id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase 동기화 점검 실패 (HTTP $CODE). 프로젝트 정지 또는 키·정책 변경 가능성."
            head -c 500 /tmp/body.txt || true
            exit 1
          fi
          echo "✅ Supabase 정상 — 클라우드 동기화 가능 상태"
