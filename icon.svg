<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#C47D0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8B0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE8B0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 라운드 사각형 -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#g)"/>

  <!-- 빛 효과 -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- 태양 광선 -->
  <g fill="#fff" opacity="0.95">
    <rect x="240" y="80" width="32" height="60" rx="14"/>
    <rect x="240" y="372" width="32" height="60" rx="14"/>
    <rect x="80" y="240" width="60" height="32" rx="14"/>
    <rect x="372" y="240" width="60" height="32" rx="14"/>
    <rect x="240" y="80" width="32" height="60" rx="14" transform="rotate(45 256 110)"/>
    <rect x="240" y="372" width="32" height="60" rx="14" transform="rotate(45 256 402)"/>
    <rect x="240" y="80" width="32" height="60" rx="14" transform="rotate(-45 256 110)"/>
    <rect x="240" y="372" width="32" height="60" rx="14" transform="rotate(-45 256 402)"/>
  </g>

  <!-- 태양 본체 -->
  <circle cx="256" cy="256" r="100" fill="#fff"/>
  <circle cx="256" cy="256" r="100" fill="url(#g)" opacity="0.15"/>

  <!-- 가운데 글자 -->
  <text x="256" y="295" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="110" font-weight="900" fill="#F5A623">☀</text>
</svg>
